; Beacon DATV 13 cm - IZ7PDX
; HW0001: firmware di prova della scheda ESP32-S3 N16R8 + OV3660 (nessuna RF)

[env:hwtest]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 921600

; flash 16 MB quad, PSRAM 8 MB octal nel chip (ESP32-S3R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=4
    -DHWTEST_VERSION=\"HW0001\"
