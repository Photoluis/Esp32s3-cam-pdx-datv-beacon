<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32-S3_CAM_PDX_DATV_BEACON</title>
<style>
:root{--bg:#0f1418;--card:#182028;--line:#2a3642;--text:#e6edf3;--muted:#8b9aa8;--acc:#36c2ff;--ok:#3ccf7a;--warn:#ffb347;--bad:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Arabic","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:.02em;word-break:break-all}.bname{font-size:20px;font-weight:700;color:var(--acc);margin-top:2px}
.st{font-size:13px;color:var(--muted)}
#langs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#langs button{background:transparent;border:2px solid transparent;border-radius:6px;padding:2px;line-height:0;cursor:pointer}
#langs button.on{border-color:var(--acc)}
#langs svg{width:30px;height:20px;border-radius:2px;display:block}
main{padding:12px 16px;max-width:640px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;font-size:16px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[inputmode],input[type=number]{direction:ltr}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--text)}
.chk input{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;color:#06121a;background:var(--acc)}
button.sec{background:var(--line);color:var(--text)}
button.go{background:var(--ok);grid-column:1/-1}
#msg{min-height:20px;font-size:14px;margin:4px 0 10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
small{color:var(--muted)}
@media(max-width:420px){.g{grid-template-columns:1fr}#langs{gap:3px}#langs svg{width:24px;height:16px}}
</style>
</head>
<body>
<header><div><h1>ESP32-S3_CAM_PDX_DATV_BEACON</h1><div class="bname" id="call">…</div></div><div class="st" id="st"></div>
<div id="langs"></div></header>
<main>
<section><h2 data-t="s_status"></h2>
<div class="kv">
<b>Firmware</b><span id="fw">–</span>
<b data-t="mode"></b><span id="mode">–</span>
<b data-t="up"></b><span id="up">–</span>
<b data-t="temp"></b><span id="temp">–</span>
</div></section>

<form id="f">
<section><h2 data-t="s_tx"></h2>
<div class="g">
<label><span data-t="freq"></span><input name="freq" inputmode="decimal" id="freq"></label>
<label>Symbol rate (kS)<select name="sr" id="sr"><option>125</option><option>250</option><option>333</option><option>500</option><option value="1000" data-t="sr1000">1000</option></select></label>
<label><span data-t="fec"></span><select name="fec" id="fec"><option>1/2</option><option>3/5</option><option>2/3</option><option>3/4</option><option>4/5</option><option>5/6</option><option>8/9</option><option>9/10</option></select></label>
<label><span data-t="level"></span><span style="display:flex;align-items:center;gap:10px"><input name="level" id="level" type="range" min="-40" max="-5" step="0.5" style="flex:1;padding:0;accent-color:var(--acc)"><output id="levelv" style="min-width:64px;text-align:end;font-size:16px;color:var(--text)">–</output></span></label>
<label>QRZ<input name="call" id="callin" autocapitalize="characters"></label>
<label>QTH Locator<input name="loc" id="loc" autocapitalize="characters" maxlength="6" placeholder="JN80PS"></label>
<label><span data-t="dc"></span><span style="display:flex;gap:6px"><input name="dci" id="dci" inputmode="text" autocomplete="off"><input name="dcq" id="dcq" inputmode="text" autocomplete="off"></span></label>
</div>
<p id="nocall" class="warn" style="display:none;margin:8px 0 4px;font-weight:600" data-t="nocall"></p>
<small><span data-t="lvl_note"></span><br><span data-t="band1"></span> <bdi id="band">2300–2450</bdi> <span data-t="band2"></span></small>
</section>

<section><h2 data-t="s_xvtr"></h2>
<div class="g">
<label><span data-t="lo"></span><input name="lo" id="lo" inputmode="decimal"></label>
<label><span data-t="xvtr"></span><select name="xvtr" id="xvtr"><option value="sum" data-t="o_sum"></option><option value="diff" data-t="o_diff"></option></select></label>
</div>
<p><b data-t="final"></b> <bdi id="final">–</bdi> MHz <span id="inv" class="warn"></span></p>
<small data-t="xv_note"></small>
</section>

<section><h2 data-t="s_cycle"></h2>
<div class="g">
<label><span data-t="mono"></span><input name="mono" id="mono" inputmode="numeric"></label>
<label><span data-t="monosrc"></span><select name="monosrc" id="monosrc"><option value="std" data-t="o_std"></option><option value="video" data-t="o_video"></option><option value="image" data-t="o_image"></option><option value="live" data-t="o_live"></option></select></label>
<label><span data-t="cam"></span><input name="cam" id="cam" inputmode="numeric"></label>
<label><span data-t="cammode"></span><select name="cammode" id="cammode"><option value="pip" data-t="o_pip"></option><option value="full" data-t="o_full"></option></select></label>
<label><span data-t="pipbg"></span><select name="pipbg" id="pipbg"><option value="std" data-t="o_bars"></option><option value="image" data-t="o_image"></option></select></label>
<label><span data-t="pause"></span><input name="pause" id="pause" inputmode="numeric"></label>
<label><span data-t="wait"></span><input name="wait" id="wait" inputmode="numeric"></label>
</div>
<small data-t="cycle_note"></small>
<p><label class="chk"><input type="checkbox" id="camh"> <span data-t="camh"></span></label></p>
<p><label class="chk"><input type="checkbox" id="camv"> <span data-t="camv"></span></label></p>
<p><label class="chk"><input type="checkbox" id="ovl"> <span data-t="ovl"></span></label></p>
<p><label class="chk"><input type="checkbox" id="telem"> <span data-t="telem"></span></label></p>
<p><label class="chk"><input type="checkbox" id="auto"> <span data-t="auto"></span></label></p>
<label><span data-t="led"></span><select name="led" id="led"><option value="normal" data-t="o_led_norm"></option><option value="min" data-t="o_led_min"></option><option value="off" data-t="o_led_off"></option></select></label>
</section>

<section><h2 data-t="s_wifi"></h2>
<label><span data-t="appass"></span><input name="appass" id="appass" type="password" autocomplete="new-password"></label>
<small data-t="wifi_note"></small>
</section>

<div id="msg"></div>
<div class="btns">
<button type="submit" data-t="b_apply"></button>
<button type="button" id="save" data-t="b_save"></button>
<button type="button" class="sec" id="def" data-t="b_def"></button>
<button type="button" class="sec" id="reload" data-t="b_reload"></button>
<button type="button" class="go" id="start" data-t="b_start"></button>
</div>
<p><small data-t="tx_note"></small></p>
</form>

<section><h2 data-t="s_media"></h2>
<div class="kv">
<b data-t="m_std"></b><span id="m_es_std">–</span>
<b data-t="m_bg"></b><span id="m_img_std">–</span>
<b data-t="m_vid"></b><span id="m_es_usr">–</span>
<b data-t="m_img"></b><span id="m_img_usr">–</span>
</div>
<small data-t="media_note"></small>
<h2 style="margin-top:14px" data-t="s_img"></h2>
<input type="file" id="imgfile" accept="image/*">
<canvas id="prev" width="320" height="240" style="width:100%;max-width:320px;margin:8px 0;border:1px solid var(--line);display:none"></canvas>
<div class="btns"><button type="button" id="imgup" disabled data-t="b_imgup"></button><button type="button" class="sec" id="imgdel" data-t="b_imgdel"></button></div>
<small data-t="img_note"></small>
<h2 style="margin-top:14px" data-t="s_vid"></h2>
<input type="file" id="esfile" accept=".bin">
<div class="btns" style="margin-top:8px"><button type="button" id="esup" disabled data-t="b_esup"></button><button type="button" class="sec" id="esdel" data-t="b_esdel"></button></div>
<small data-t="vid_note"></small>
<div id="umsg" style="min-height:20px;font-size:14px;margin-top:8px"></div>
</section>
</main>

preview:'المعاينة جاهزة',uploading:'جارٍ الرفع…',upload_fail:'توقف الرفع',confirm_erase:'حذف الملف المخصص؟ يبقى الملف القياسي.',
saved:'تم حفظ الإعداد.',nvs_err:'خطأ في الكتابة إلى الذاكرة.',defaults:'القيم الافتراضية (لم تُحفظ بعد).',
starting:'المنارة تبدأ: سيتوقف Wi-Fi. اضغط BOOT لإيقافها.',loaded:'تم الرفع',erased:'تم حذف الملف المخصص.',erase_fail:'تعذّر الحذف.',
mode_cfg:'الإعداد',mode_tx:'المنارة تبث',mode_test:'إرسال تجريبي',absent:'غير موجود',error:'خطأ'}};
let L='it';
function t(k){return(T[L]&&T[L][k])||T.it[k]||k}
let esMax=3,lastStatus='conn',lastMedia=null,lastMode='';
// messaggi del firmware (in italiano) tradotti nella lingua scelta
const SRV=[['configurazione salvata','saved'],['errore NVS','nvs_err'],['valori predefiniti','defaults'],['beacon in partenza','starting'],
 ['file personalizzato cancellato','erased'],['cancellazione non riuscita','erase_fail']];
function srv(m){for(const[a,k]of SRV)if(m.startsWith(a))return t(k);if(m.startsWith('caricato: '))return t('loaded')+': '+m.slice(10);return m}
const MODES={'configurazione':'mode_cfg','beacon in TX':'mode_tx','prova in TX':'mode_test'};
function media(v){return v==='assente'?t('absent'):v}
function setLang(l){L=T[l]?l:'en';try{localStorage.setItem('lang',L)}catch(e){}
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(v.includes('<'))e.innerHTML=v.replace('{max}',esMax);else e.textContent=v});
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 st(lastStatus);if(lastMode)$('mode').textContent=MODES[lastMode]?t(MODES[lastMode]):lastMode;
 if(lastMedia)for(const k of['es_std','img_std','es_usr','img_usr'])$('m_'+k).textContent=media(lastMedia[k]);
 showFinal();$('msg').textContent='';$('umsg').textContent=''}
function st(k){lastStatus=k;$('st').textContent=t(k);$('st').className='st '+({online:'ok',offline:'bad',intx:'warn'}[k]||'')}
for(const l of Object.keys(FLAGS)){const b=document.createElement('button');b.type='button';b.dataset.l=l;b.title=NAMES[l];b.setAttribute('aria-label',NAMES[l]);
 b.innerHTML=FLAGS[l];b.onclick=()=>setLang(l);$('langs').appendChild(b)}
// ---- stato e configurazione
function msg(m,c){const e=$('msg');e.textContent=m;e.className=c||''}
let lastCfg=null;
function showFinal(){if(!lastCfg)return;$('final').textContent=lastCfg.final.toFixed(3);$('inv').textContent=lastCfg.inv?t('inv_note'):''}
function showLevel(){$('levelv').textContent=(+$('level').value).toFixed(1)+' dB'}
function fill(c){lastCfg=c;showFinal();for(const k of['freq','sr','fec','level','dci','dcq','mono','monosrc','cam','cammode','pipbg','pause','wait','lo','xvtr','led'])$(k).value=c[k];showLevel();$('callin').value=c.call;$('loc').value=c.loc||'';$('call').textContent=c.call;$('nocall').style.display=c.call==='NOCALL'?'block':'none';$('auto').checked=!!c.auto;$('ovl').checked=!!c.ovl;$('telem').checked=!!c.telem;$('camh').checked=!!c.camh;$('camv').checked=!!c.camv}
async function status(full){
 try{const r=await fetch('/api/status');const s=await r.json();
  $('fw').textContent=s.fw;lastMode=s.mode;$('mode').textContent=MODES[s.mode]?t(MODES[s.mode]):s.mode;$('band').textContent=s.fmin+'–'+s.fmax;
  lastMedia=s.media;for(const k of['es_std','img_std','es_usr','img_usr'])$('m_'+k).textContent=media(s.media[k]);
  const mx=(s.media.es_max/1048576).toFixed(0);if(mx!=esMax){esMax=mx;setLang(L)}
  $('temp').textContent=s.temp>-90?s.temp.toFixed(1)+' °C':'–';
  const u=s.uptime;$('up').textContent=Math.floor(u/3600)+' h '+Math.floor(u%3600/60)+' min';
  st('online');if(full)fill(s.cfg);
 }catch(e){st('offline')}}
function body(){const d=new URLSearchParams(new FormData($('f')));d.set('auto',$('auto').checked?'on':'off');d.set('ovl',$('ovl').checked?'on':'off');d.set('telem',$('telem').checked?'on':'off');d.set('camh',$('camh').checked?'on':'off');d.set('camv',$('camv').checked?'on':'off');return d}
async function post(u,b){const r=await fetch(u,{method:'POST',body:b});return r.json()}
async function apply(){const j=await post('/api/set',body());$('appass').value='';fill(j.cfg);
 if(j.ok)msg(t('applied'),'ok');else msg(t('errors')+': '+j.errors.map(e=>e.split(':')[0]).join(', '),'bad');return j.ok}
$('f').onsubmit=e=>{e.preventDefault();apply()};
$('level').oninput=showLevel;
$('save').onclick=async()=>{if(await apply()){const j=await post('/api/save','');msg(srv(j.msg),j.ok?'ok':'bad')}};
$('def').onclick=async()=>{const j=await post('/api/defaults','');await status(true);msg(srv(j.msg),'warn')};
$('reload').onclick=()=>status(true).then(()=>msg('',''));
$('start').onclick=async()=>{if(!confirm(t('confirm_start')))return;
 if(!await apply())return;const j=await post('/api/start','');msg(srv(j.msg),'warn');st('intx')};
// ---- monoscopi personalizzati
function umsg(m,c){const e=$('umsg');e.textContent=m;e.className=c||''}
const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0}return tb})();
function crc32(a){let c=0xFFFFFFFF;for(let i=0;i<a.length;i++)c=CRC[(c^a[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
let imgBlob=null;
$('imgfile').onchange=async()=>{const f=$('imgfile').files[0];if(!f)return;
 const im=await createImageBitmap(f);const cv=$('prev'),g=cv.getContext('2d');
 // ritaglio centrale 4:3 ("cover"), poi RGB -> YUYV (BT.601, livelli TV)
 const r=Math.max(320/im.width,240/im.height),w=320/r,h=240/r;g.drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,0,320,240);
 cv.style.display='block';const px=g.getImageData(0,0,320,240).data;
 const n=320*240*2,buf=new Uint8Array(64+n),dv=new DataView(buf.buffer);let o=64;
 const Y=(r,g,b)=>16+(65.738*r+129.057*g+25.064*b)/256;
 for(let i=0;i<320*240*4;i+=8){const R=(px[i]+px[i+4])/2,G=(px[i+1]+px[i+5])/2,B=(px[i+2]+px[i+6])/2;
  buf[o++]=Y(px[i],px[i+1],px[i+2]);buf[o++]=128+(-37.945*R-74.494*G+112.439*B)/256;
  buf[o++]=Y(px[i+4],px[i+5],px[i+6]);buf[o++]=128+(112.439*R-94.154*G-18.285*B)/256}
 'PDXIMG01'.split('').forEach((ch,k)=>buf[k]=ch.charCodeAt(0));
 dv.setUint16(8,320,true);dv.setUint16(10,240,true);dv.setUint32(12,1,true);dv.setUint32(16,n,true);
 dv.setUint32(20,crc32(buf.subarray(64)),true);
 const lab=f.name.replace(/\.[^.]*$/,'').replace(/[^ -~]/g,'_').slice(0,35);for(let k=0;k<lab.length;k++)buf[24+k]=lab.charCodeAt(k);
 imgBlob=buf;$('imgup').disabled=false;umsg(t('preview')+': '+lab,'')};
async function upload(kind,data,btn){btn.disabled=true;umsg(t('uploading'),'warn');
 try{const r=await fetch('/api/upload?kind='+kind,{method:'POST',body:data});const j=await r.json();umsg(j.ok?srv(j.msg):t('error')+': '+j.msg,j.ok?'ok':'bad')}
 catch(e){umsg(t('upload_fail'),'bad')}btn.disabled=false;status(false)}
$('imgup').onclick=()=>imgBlob&&upload('image',imgBlob,$('imgup'));
$('esfile').onchange=()=>{$('esup').disabled=!$('esfile').files[0]};
$('esup').onclick=()=>{const f=$('esfile').files[0];if(f)upload('video',f,$('esup'))};
async function erase(kind){if(!confirm(t('confirm_erase')))return;
 const j=await post('/api/erase?kind='+kind,'');umsg(srv(j.msg),j.ok?'ok':'bad');status(false)}
$('imgdel').onclick=()=>erase('image');$('esdel').onclick=()=>erase('video');
// lingua: ?lang=xx, poi quella scelta l'ultima volta, poi quella del browser, altrimenti inglese
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
setLang(new URLSearchParams(location.search).get('lang')||saved||(navigator.language||'en').slice(0,2).toLowerCase());
status(true);setInterval(()=>status(false),5000);
</script>
</body>
