<html lang="it">
<head>

<style>
:root{--bg:#0f1418;--card:#182028;--line:#2a3642;--text:#e6edf3;--muted:#8b9aa8;--acc:#36c2ff;--ok:#3ccf7a;--warn:#ffb347;--bad:#ff5c5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Arabic","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:.02em;word-break:break-all}.bname{font-size:20px;font-weight:700;color:var(--acc);margin-top:2px}
.st{font-size:13px;color:var(--muted)}
#langs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#langs button{background:transparent;border:2px solid transparent;border-radius:6px;padding:2px;line-height:0;cursor:pointer}
#langs button.on{border-color:var(--acc)}
#langs svg{width:30px;height:20px;border-radius:2px;display:block}
main{padding:12px 16px;max-width:640px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px;font-size:16px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[inputmode],input[type=number]{direction:ltr}
.chk{flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--text)}
.chk input{width:22px;height:22px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:8px;padding:12px;font-size:15px;font-weight:600;color:#06121a;background:var(--acc)}
button.sec{background:var(--line);color:var(--text)}
button.go{background:var(--ok);grid-column:1/-1}
#msg{min-height:20px;font-size:14px;margin:4px 0 10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
small{color:var(--muted)}
#log{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;height:320px;overflow:auto;margin:10px 0;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left}
#log .cmd{color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:0;width:auto;direction:ltr}.row button{padding:9px 14px}
@media(max-width:420px){.g{grid-template-columns:1fr}#langs{gap:3px}#langs svg{width:24px;height:16px}}
</style>
</head>

let esMax=3,lastStatus='conn',lastMedia=null,lastMode='';
// messaggi del firmware (in italiano) tradotti nella lingua scelta
const SRV=[['configurazione salvata','saved'],['errore NVS','nvs_err'],['valori predefiniti','defaults'],['beacon in partenza','starting'],
 ['file personalizzato cancellato','erased'],['cancellazione non riuscita','erase_fail']];
function srv(m){for(const[a,k]of SRV)if(m.startsWith(a))return t(k);if(m.startsWith('caricato: '))return t('loaded')+': '+m.slice(10);return m}
const MODES={'configurazione':'mode_cfg','beacon in TX':'mode_tx','prova in TX':'mode_test'};
function media(v){return v==='assente'?t('absent'):v}
function setLang(l){L=T[l]?l:'en';try{localStorage.setItem('lang',L)}catch(e){}
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(v.includes('<'))e.innerHTML=v.replace('{max}',esMax);else e.textContent=v});
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 st(lastStatus);if(lastMode)$('mode').textContent=MODES[lastMode]?t(MODES[lastMode]):lastMode;
 if(lastMedia)for(const k of['es_std','img_std','es_usr','img_usr'])$('m_'+k).textContent=media(lastMedia[k]);
 showFinal();$('msg').textContent='';$('umsg').textContent='';$('scmd').placeholder=t('cmd_ph');serShow()}
function st(k){lastStatus=k;$('st').textContent=t(k);$('st').className='st '+({online:'ok',offline:'bad',intx:'warn'}[k]||'')}
for(const l of Object.keys(FLAGS)){const b=document.createElement('button');b.type='button';b.dataset.l=l;b.title=NAMES[l];b.setAttribute('aria-label',NAMES[l]);
 b.innerHTML=FLAGS[l];b.onclick=()=>setLang(l);$('langs').appendChild(b)}
// ---- trasporto: HTTP se la pagina viene dalla scheda (access point), altrimenti Web Serial (GitHub Pages, localhost).
// Sulla seriale ogni carattere ferma la TX: la pagina invia solo quando dal log sa che la scheda è in configurazione.
const SER=location.hostname!=='192.168.4.1';
let port=null,reader=null,writer=null,serState='off',serBusy=false,apiQ=Promise.resolve(),apiWait=null,lineWait=null,cfgAfterBoot=false,lastPort=null;
const enc=new TextEncoder();
async function serWrite(d){if(!writer)throw Error('port');await writer.write(typeof d==='string'?enc.encode(d):d)}
// stessa interfaccia di fetch(...).json(): sulla seriale "API <op> [arg]" e la risposta è la riga "@API {json}"
function api(path,body){
 if(!SER)return fetch(path,body===undefined?undefined:{method:'POST',body}).then(r=>r.json());
 const[p,q]=path.split('?'),op=p.slice(5),kind=new URLSearchParams(q||'').get('kind');
 const cmd='API '+op+(kind?' '+kind:body?' '+String(body):'')+'\n';
 const run=()=>new Promise((ok,ko)=>{const tm=setTimeout(()=>{apiWait=null;ko(Error('timeout'))},3000);
  apiWait={ok:j=>{clearTimeout(tm);ok(j)},ko:e=>{clearTimeout(tm);ko(e)}};
  serWrite(cmd).catch(e=>{apiWait=null;clearTimeout(tm);ko(e)})});
 // un solo nuovo tentativo se la riga è arrivata rovinata (primo comando dopo l'avvio)
 const r=apiQ.then(run,run).catch(e=>{if(e.message==='garbled')return new Promise(ok=>setTimeout(ok,300)).then(run);throw e});
 apiQ=r.catch(()=>{});return r}
// stato della scheda dedotto dal log: off, unknown (appena connessi), config, auto (attesa AUTO TX), tx, boot
function setSer(k){serState=k;serShow()}
function serShow(){if(!SER)return;const c=port&&serState!=='off';
 $('sconn').textContent=t(port?'b_disconnect':'b_connect');
 $('sload').style.display=c&&serState!=='config'?'':'none';
 $('sstop').style.display=c&&(serState==='tx'||serState==='auto')?'':'none';
 $('sst').textContent=!('serial'in navigator)?t('ser_nosup'):!c?'':serState==='unknown'?t('ser_unknown'):serState==='config'?'':t('ser_tx');
 document.querySelectorAll('main button:not(.ser)').forEach(b=>{if(!b.id||!['imgup','esup'].includes(b.id))b.disabled=serState!=='config'});
 st(!c?'ser_off':serState==='config'?'online':serState==='unknown'?'conn':'intx')}
const LOGMAX=2000;
function logAdd(l,cls){const e=$('log'),d=document.createElement('div');d.textContent=l;
 if(cls)d.className=cls;else if(/^(ERR|ATTENZIONE)/.test(l))d.className='bad';else if(/^(OK|AUTO TX|BEACON|TX )/.test(l))d.className='warn';
 e.appendChild(d);while(e.childNodes.length>LOGMAX)e.removeChild(e.firstChild);if($('sauto').checked)e.scrollTop=e.scrollHeight}
function onLine(l){
 if(l.startsWith('@API ')){const w=apiWait;apiWait=null;let j=null;try{j=JSON.parse(l.slice(5))}catch(e){}
  if(serState!=='config')setSer('config');if(w)j?w.ok(j):w.ko(Error('json'));return}
 if(serBusy&&/^ACK \d+$/.test(l)){lineWait&&lineWait(l);return}   // caricamento: gli ACK non riempiono il log
 logAdd(l);
 // senza il comando API il firmware vecchio risponde "ERR comando sconosciuto" (quello nuovo aggiunge il testo ricevuto)
 if(apiWait&&l.startsWith('ERR comando sconosciuto')){const w=apiWait;apiWait=null;const old=l.trim()==='ERR comando sconosciuto';
  w.ko(Error(old?'old':'garbled'));if(old)msg(t('ser_old'),'bad');return}
 if(lineWait)lineWait(l);
 if(/^(AUTO TX OFF|AUTO TX annullata|OK modo configurazione)/.test(l)){cfgAfterBoot=false;setSer('config');status(true)}
 else if(/^RIAVVIO/.test(l)){cfgAfterBoot=l.includes('"CONFIGMODE"');setSer(cfgAfterBoot?'boot':'tx')}
 else if(/^=== ESP32/.test(l))setSer('boot');
 else if(/^AUTO TX (ON|tra)/.test(l))setSer('auto');
 else if(/^BEACON avvio/.test(l))setSer('tx')}
async function readLoop(p){const dec=new TextDecoder();let buf='';
 while(port===p&&p.readable){reader=p.readable.getReader();
  try{for(;;){const{value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
   let i;while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).replace(/\r$/,'');buf=buf.slice(i+1);if(l)onLine(l)}
   if(buf.length>4096)buf=''}}
  catch(e){if(port===p)logAdd('— '+e.message+' —','bad')}finally{try{reader.releaseLock()}catch(e){}reader=null}}
 if(port===p)serGone()}
async function serOpen(p){
 // DTR/RTS non toccati: la scheda non si resetta e la TX in corso continua
 try{await p.open({baudRate:115200,bufferSize:65536})}catch(e){if(e.name!=='InvalidStateError'){logAdd(e.message,'bad');return}}
 port=lastPort=p;writer=p.writable.getWriter();logAdd('— '+t('online')+' —','cmd');
 if(cfgAfterBoot){setSer('boot');setTimeout(()=>{if(port===p&&serState==='boot'){cfgAfterBoot=false;setSer('config');status(true)}},2500)}
 else setSer('unknown');
 readLoop(p)}
// porta persa (cavo, riavvio USB, errore): va chiusa, altrimenti Chrome la tiene occupata e non si riapre più
function serGone(){const p=port;try{writer&&writer.releaseLock()}catch(e){}writer=null;port=null;if(apiWait){apiWait.ko(Error('port'));apiWait=null}
 setSer('off');if(p)p.close().catch(()=>{})}
async function serClose(){const p=port;lastPort=null;port=null;try{reader&&await reader.cancel()}catch(e){}
 try{writer&&writer.releaseLock()}catch(e){}writer=null;try{await p.close()}catch(e){}setSer('off')}
function serInit(){$('serial').style.display='';serShow();if(!('serial'in navigator)){$('sconn').disabled=true;return}
 $('sconn').onclick=async()=>{if(port)return serClose();try{await serOpen(await navigator.serial.requestPort())}catch(e){}};
 $('sload').onclick=()=>status(true);                 // il primo carattere ferma una TX: poi il riavvio porta in configurazione
 $('sstop').onclick=()=>serWrite('\n').catch(()=>{});
 const send=()=>{const c=$('scmd').value.trim();if(!c||!port)return;logAdd('> '+c,'cmd');$('scmd').value='';
  if(/^(CW|TONE|QPSK|PLAY|ESPLAY|BEACON|PARROT|RX)/i.test(c))setSer('tx');serWrite(c+'\n').catch(()=>{})};
 $('ssend').onclick=send;$('scmd').onkeydown=e=>{if(e.key==='Enter')send()};
 $('sclr').onclick=()=>{$('log').textContent=''};
 $('sdl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[...$('log').childNodes].map(n=>n.textContent).join('\n')+'\n'],{type:'text/plain'}));
  a.download='beacon-log-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 // riavvio della XIAO (USB nativa) o cavo staccato e riattaccato: la porta già autorizzata si riapre da sola
 let lastAuto=0;
 navigator.serial.addEventListener('connect',e=>{if(!port&&lastPort===e.target&&Date.now()-lastAuto>5000){lastAuto=Date.now();serOpen(e.target)}});
 navigator.serial.addEventListener('disconnect',e=>{if(port===e.target)serGone()})}
// MEDIAW: blocchi da 2048 byte, la scheda risponde "ACK <byte>" dopo ciascuno e alla fine "OK caricato: ..." o "ERR ..."
function expect(re,ms){return new Promise((ok,ko)=>{const tm=setTimeout(()=>{lineWait=null;ko(Error('timeout'))},ms);
 lineWait=l=>{if(l.startsWith('ERR')){clearTimeout(tm);lineWait=null;ko(Error(l.slice(4)))}else if(re.test(l)){clearTimeout(tm);lineWait=null;ok(l)}}})}
async function serUpload(kind,data){const b=data instanceof Uint8Array?data:new Uint8Array(await data.arrayBuffer());
 if(serState!=='config')return{ok:false,msg:t('ser_tx')};
 serBusy=true;await apiQ;
 try{let w=expect(/^READY/,10000);await serWrite('MEDIAW '+kind.toUpperCase()+' '+b.length+' '+crc32(b).toString(16)+'\n');await w;
  const t0=Date.now();
  for(let p=0;p<b.length;p+=2048){const n=Math.min(2048,b.length-p),last=p+n>=b.length;
   w=expect(last?/^OK caricato/:new RegExp('^ACK '+(p+n)+'$'),15000);await serWrite(b.subarray(p,p+n));const l=await w;
   if(last)return{ok:true,msg:l.slice(3)};
   const s=(Date.now()-t0)/1000,r=Math.round(s*(b.length-p-n)/(p+n));umsg(t('uploading')+' '+Math.floor(100*(p+n)/b.length)+' %  (~'+r+' s)','warn')}}
 catch(e){return{ok:false,msg:e.message}}
 finally{serBusy=false}}

// ---- stato e configurazione
function msg(m,c){const e=$('msg');e.textContent=m;e.className=c||''}
let lastCfg=null;
function showFinal(){if(!lastCfg)return;$('final').textContent=lastCfg.final.toFixed(3);$('inv').textContent=lastCfg.inv?t('inv_note'):''}
function showLevel(){$('levelv').textContent=(+$('level').value).toFixed(1)+' dB'}
function fill(c){lastCfg=c;showFinal();for(const k of['freq','sr','fec','level','dci','dcq','mono','monosrc','cam','cammode','pipbg','pause','wait','lo','xvtr','led','preply','pstab'])$(k).value=c[k];showLevel();if('audio'in c)$('audio').value=c.audio;else $('audiol').style.display='none';$('callin').value=c.call;$('loc').value=c.loc||'';$('call').textContent=c.call;$('nocall').style.display=c.call==='NOCALL'?'block':'none';$('auto').checked=!!c.auto;$('ovl').checked=!!c.ovl;$('telem').checked=!!c.telem;$('camh').checked=!!c.camh;$('camv').checked=!!c.camv;$('parrot').checked=!!c.parrot;$('wifi').checked=c.wifi!==0;$('wifi').closest('p').style.display='wifi'in c?'':'none';sched()}
async function status(full){
 try{const s=await api('/api/status');
  $('fw').textContent=s.fw;lastMode=s.mode;$('mode').textContent=MODES[s.mode]?t(MODES[s.mode]):s.mode;$('band').textContent=s.fmin+'–'+s.fmax;
  if(s.nocam)for(const k of['cam','cammode','pipbg','camh','camv'])$(k).closest('label').style.display='none';
  lastMedia=s.media;for(const k of['es_std','img_std','es_usr','img_usr'])$('m_'+k).textContent=media(s.media[k]);
  const mx=(s.media.es_max/1048576).toFixed(0);if(mx!=esMax){esMax=mx;setLang(L)}
  $('temp').textContent=s.temp>-90?s.temp.toFixed(1)+' °C':'–';
  boardOff=s.time?s.time*1000-Date.now():null;showTime();
  if(full&&Date.now()-timeSynced>10000&&(!s.time||Math.abs(boardOff)>2000)){timeSynced=Date.now();setTime(true)}   // anche dopo uno spegnimento
  const u=s.uptime;$('up').textContent=Math.floor(u/3600)+' h '+Math.floor(u%3600/60)+' min';
  const q=s.qso;$('qso').textContent=q?('#'+q.n+'  '+q.call+'  MER '+q.mer.toFixed(1)+' dB  D '+q.d.toFixed(1)+'  '+q.sr+' kS '+q.fec+'  '+(q.foff>=0?'+':'')+q.foff.toFixed(1)+' kHz'+(q.utc?'  '+new Date(q.utc*1000).toISOString().slice(11,16)+'Z':'')):t('noqso');
  st('online');if(full)fill(s.cfg);
 }catch(e){st('offline')}}
function body(){const d=new URLSearchParams(new FormData($('f')));d.set('auto',$('auto').checked?'on':'off');d.set('ovl',$('ovl').checked?'on':'off');d.set('telem',$('telem').checked?'on':'off');d.set('camh',$('camh').checked?'on':'off');d.set('camv',$('camv').checked?'on':'off');d.set('parrot',$('parrot').checked?'on':'off');if(!(lastCfg&&'audio'in lastCfg))d.delete('audio');if(lastCfg&&'wifi'in lastCfg)d.set('wifi',$('wifi').checked?'on':'off');return d}
async function post(u,b){return api(u,b)}
async function apply(){const j=await post('/api/set',body());$('appass').value='';fill(j.cfg);
 if(j.ok)msg(t('applied'),'ok');else msg(t('errors')+': '+j.errors.map(e=>e.split(':')[0]).join(', '),'bad');return j.ok}
$('f').onsubmit=e=>{e.preventDefault();apply()};
// ---- schema del ciclo: durate dai campi della pagina (anche prima di Applica)
function num(id){const v=parseInt($(id).value,10);return isNaN(v)?0:v}
function sched(){const svg=$('sched');if(!svg)return;
 const M=num('mono'),C=num('cam'),P=num('pause'),W=num('wait'),R=num('preply'),S=num('pstab'),par=$('parrot').checked,au=$('auto').checked;
 const RED='#e5484d',GRN='#3ccf7a',YEL='#e0b43a',TXT='#06121a',MUT='#8b9aa8';
 const cyc=M+C+P,x0=10,wid=580;let h='';
 const box=(x,y,w,hh,c,l1,l2)=>{h+=`<rect x="${x}" y="${y}" width="${Math.max(w,2)}" height="${hh}" rx="5" fill="${c}"/>`;
  if(w>44){h+=`<text x="${x+w/2}" y="${y+hh/2-(l2?3:-5)}" text-anchor="middle" font-size="13" font-weight="700" fill="${TXT}">${l1}</text>`;
   if(l2)h+=`<text x="${x+w/2}" y="${y+hh/2+13}" text-anchor="middle" font-size="11" fill="${TXT}">${l2}</text>`}};
 const lab=(x,y,s,a)=>{h+=`<text x="${x}" y="${y}" font-size="12" fill="${MUT}" text-anchor="${a||'start'}">${s}</text>`};
 lab(x0,16,au?t('sc_boot').replace('{s}',W):t('sc_manual'));
 if(cyc<=0){h+=`<text x="300" y="80" text-anchor="middle" fill="${RED}" font-size="14">${t('sc_empty')}</text>`;svg.innerHTML=h;$('schedtxt').textContent='';return}
 let x=x0;const sc=wid/cyc,y=30,hh=56;
 if(M){box(x,y,M*sc,hh,RED,t('sc_mono'),M+' s TX');x+=M*sc}
 if(C){box(x,y,C*sc,hh,RED,t('sc_cam'),C+' s TX');x+=C*sc}
 if(P){box(x,y,P*sc,hh,par?GRN:YEL,par?t('sc_listen'):t('sc_pause'),P+' s '+(par?'RX':''));}
 h+=`<path d="M${x0+wid-4} ${y+hh+6} v10 H${x0+4} v-10" fill="none" stroke="${MUT}" stroke-width="1.5"/><path d="M${x0+4} ${y+hh+4} l-4 8 h8z" fill="${MUT}"/>`;
 lab(300,y+hh+30,t('sc_cycle').replace('{s}',cyc),'middle');
 const tx=Math.round(100*(M+C)/cyc);let txt=t('sc_ratio').replace('{tx}',tx).replace('{p}',100-tx).replace('{k}',par?'RX':t('sc_idle'));
 if(par&&P){const y2=140,parts=[[t('sc_heard'),1,GRN],[t('sc_wait')+' '+S+' s',S,GRN],[t('sc_cap'),2,GRN],[t('sc_dec'),21,YEL],[t('sc_reply'),R,RED]];
  /* i primi tre passi sono brevi: larghezza fissa leggibile, il resto in proporzione */
  const fx=[70,80,70],rest=wid-fx.reduce((a,b)=>a+b,0),s2=rest/(21+R);let x2=x0;lab(x0,y2-8,t('sc_qso'));
  parts.forEach(([p,d,c],i)=>{const w=i<3?fx[i]:d*s2;box(x2,y2,w-2,40,c,p,d+' s');x2+=w})
  lab(300,y2+58,t('sc_after'),'middle');
  const f=lastCfg?lastCfg.final.toFixed(3):$('freq').value;
  txt+='<br>'+t('sc_how').replace('{f}',f).replace('{sr}',$('sr').value).replace('{n}',S+4).replace('{r}',S+26);
  if(P<S+25)txt+='<br><span class="warn">'+t('sc_short').replace('{n}',S+25)+'</span>'}
 // stessa formula di pdx_cycle_min() nel firmware
 if(boardOff!==null){const n=Math.max(Math.ceil((M+C+(par&&P?20:5))/60),Math.floor((M+C+P+30)/60));
  txt+='<br>'+t(n>1?'sc_alignN':'sc_align1').replace(/\{n\}/g,n).replace('{p}',n*60-M-C)}
 else txt+='<br><small>'+t('sc_noalign')+'</small>';
 svg.setAttribute('viewBox',par&&P?'0 0 600 210':'0 0 600 120');svg.innerHTML=h;$('schedtxt').innerHTML=txt}
for(const id of['mono','cam','pause','wait','preply','pstab','parrot','auto','freq','sr'])$(id).addEventListener('input',sched);$('level').oninput=showLevel;
$('save').onclick=async()=>{if(await apply()){const j=await post('/api/save','');msg(srv(j.msg),j.ok?'ok':'bad')}};
$('def').onclick=async()=>{const j=await post('/api/defaults','');await status(true);msg(srv(j.msg),'warn')};
// ---- ora: la scheda non ha RTC a batteria; la pagina la imposta da sola (scarto > 2 s) e con il pulsante
let boardOff=null,timeSynced=0;
function showTime(){$('btime').textContent=boardOff===null?t('time_unset'):new Date(Date.now()+boardOff).toISOString().replace('T',' ').slice(0,19)+'Z'}
async function setTime(quiet){try{const j=await post('/api/time','t='+Date.now());
  if(j.ok){boardOff=0;showTime();sched();if(!quiet)msg(t('time_ok').replace('{d}',(j.delta/1000).toFixed(1)),'ok')}else msg(srv(j.msg),'bad')}catch(e){}}
$('settime').onclick=()=>setTime(false);setInterval(showTime,1000);
$('reload').onclick=()=>status(true).then(()=>msg('',''));
$('start').onclick=async()=>{if(!confirm(t('confirm_start')))return;
 if(!await apply())return;
 if(SER){await serWrite('BEACON\n');setSer('tx');msg(t('ser_started'),'warn');return}
 const j=await post('/api/start','');msg(srv(j.msg),'warn');st('intx')};
// ---- monoscopi personalizzati
function umsg(m,c){const e=$('umsg');e.textContent=m;e.className=c||''}
const CRC=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0}return tb})();
function crc32(a){let c=0xFFFFFFFF;for(let i=0;i<a.length;i++)c=CRC[(c^a[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
let imgBlob=null;
$('imgfile').onchange=async()=>{const f=$('imgfile').files[0];if(!f)return;
 const im=await createImageBitmap(f);const cv=$('prev'),g=cv.getContext('2d');
 // ritaglio centrale 16:9 ("cover"), poi RGB -> YUYV (BT.601, livelli TV)
 g.fillStyle='#000';g.fillRect(0,0,320,240);const r=Math.max(320/im.width,180/im.height),w=320/r,h=180/r;g.drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,30,320,180); // 16:9 nella fascia centrale trasmessa (righe 30..209)
 cv.style.display='block';const px=g.getImageData(0,0,320,240).data;
 const n=320*240*2,buf=new Uint8Array(64+n),dv=new DataView(buf.buffer);let o=64;
 const Y=(r,g,b)=>16+(65.738*r+129.057*g+25.064*b)/256;
 for(let i=0;i<320*240*4;i+=8){const R=(px[i]+px[i+4])/2,G=(px[i+1]+px[i+5])/2,B=(px[i+2]+px[i+6])/2;
  buf[o++]=Y(px[i],px[i+1],px[i+2]);buf[o++]=128+(-37.945*R-74.494*G+112.439*B)/256;
  buf[o++]=Y(px[i+4],px[i+5],px[i+6]);buf[o++]=128+(112.439*R-94.154*G-18.285*B)/256}
 'PDXIMG01'.split('').forEach((ch,k)=>buf[k]=ch.charCodeAt(0));
 dv.setUint16(8,320,true);dv.setUint16(10,240,true);dv.setUint32(12,1,true);dv.setUint32(16,n,true);
 dv.setUint32(20,crc32(buf.subarray(64)),true);
 const lab=f.name.replace(/\.[^.]*$/,'').replace(/[^ -~]/g,'_').slice(0,35);for(let k=0;k<lab.length;k++)buf[24+k]=lab.charCodeAt(k);
 imgBlob=buf;$('imgup').disabled=false;umsg(t('preview')+': '+lab,'')};
async function upload(kind,data,btn){btn.disabled=true;umsg(t('uploading'),'warn');
 try{const j=SER?await serUpload(kind,data):await (await fetch('/api/upload?kind='+kind,{method:'POST',body:data})).json();umsg(j.ok?srv(j.msg):t('error')+': '+j.msg,j.ok?'ok':'bad')}
 catch(e){umsg(t('upload_fail'),'bad')}btn.disabled=false;status(false)}
$('imgup').onclick=()=>imgBlob&&upload('image',imgBlob,$('imgup'));
$('esfile').onchange=()=>{$('esup').disabled=!$('esfile').files[0]};
$('esup').onclick=()=>{const f=$('esfile').files[0];if(f)upload('video',f,$('esup'))};
async function erase(kind){if(!confirm(t('confirm_erase')))return;
 const j=await post('/api/erase?kind='+kind,'');umsg(srv(j.msg),j.ok?'ok':'bad');status(false)}
$('imgdel').onclick=()=>erase('image');$('esdel').onclick=()=>erase('video');
// lingua: ?lang=xx, poi quella scelta l'ultima volta, poi quella del browser, altrimenti inglese
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
setLang(new URLSearchParams(location.search).get('lang')||saved||(navigator.language||'en').slice(0,2).toLowerCase());
if(SER)serInit();else status(true);
setInterval(()=>{if(!SER||(port&&serState==='config'&&!serBusy))status(false)},5000);
</script>
